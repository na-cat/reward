<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>獎勵台帳｜報酬台帳｜보상 장부</title>
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --line:#E7DED2; --ink:#3B332C; --sub:#8A7D6E;
  --accent:#E8A0B4; --accent2:#A9C6F0; --ok:#7FB07A; --warn:#E0A33A; --bad:#D9736F;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-top)*0 + 8px)}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:16px;margin:0;font-weight:700;flex:1}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px;font-size:12px;color:var(--sub)}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--sub)}
nav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px}
.muted{color:var(--sub);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink)}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.g{background:var(--accent2);border-color:var(--accent2);color:#1f3350}
button.d{background:#fff;border-color:var(--bad);color:var(--bad)}
button.b:active{transform:translateY(1px)}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;color:var(--ink);max-width:100%}
input[type=date]{min-width:150px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
th{color:var(--sub);font-weight:600;font-size:11px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.lvb{background:var(--ink);color:#fff;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.slot{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.slot .lab{flex:0 0 96px;font-size:12px;color:var(--sub);line-height:1.25}
.slot .lab b{display:block;color:var(--ink);font-size:12px}
.slot select{flex:1;min-width:0}
.closed{color:var(--warn);font-weight:700}
.warnbox{background:#FFF6E6;border:1px solid #F0DCB4;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.okbox{background:#EEF7EE;border:1px solid #CFE6CE;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scroll{overflow-x:auto}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:#fff;margin:0 4px 4px 0;display:inline-flex;align-items:center;gap:6px}
.pill i{width:10px;height:10px;border-radius:999px;display:inline-block}
.pill button{border:0;background:none;color:var(--bad);font-size:14px;padding:0 2px}
.small{font-size:12px}
.sep{height:1px;background:var(--line);margin:10px 0}
.gate{display:inline-block;min-width:22px;text-align:center;background:#F3EDE4;border-radius:6px;font-size:11px;font-weight:700;padding:1px 5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1 id="ttl">報酬台帳</h1>
    <div class="langs">

    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main>

</main>

// 城タブでの編集により座標(x,y)が失われた既存データを、正典データ(SEED)と突き合わせて復元する
function repairCoords(){
  let fixed=0;
  Object.keys(SEED.boss).forEach(j=>{
    const cur=S.boss[j]; if(!cur||!cur.s) return;
    const seedSlots=SEED.boss[j].s||[];
    cur.s.forEach(sl=>{
      if(sl.x!==undefined && sl.y!==undefined) return; // 既に座標あり
      const seedSl=seedSlots.find(x=>x.lv===sl.lv && x.ty===sl.ty && x.x!==undefined);
      if(seedSl){ sl.x=seedSl.x; sl.y=seedSl.y; fixed++; }
    });
  });
  if(fixed) save();
}

/* ---------- 英霊枠 ---------- */
function slots(j){
  const b=S.boss[j]; if(!b) return [];
  return (b.s||[]).slice().sort((a,b)=>b.lv-a.lv);
}
// 常にLv4→Lv1の4枠で返す（未登録の枠はnull）。画像出力で列幅を揃えるために使う
function slots4(j){
  const s=slots(j);
  return [4,3,2,1].map(lv=>s.find(x=>x.lv===lv)||null);
}
function complete(j){
  const s=(S.boss[j]||{}).s||[];
  if(s.length!==4) return false;
  return new Set(s.map(x=>x.lv)).size===4 && new Set(s.map(x=>x.ty)).size===4;
}
function rankOf(lv){return 5-lv;}           // 英霊のLvだけを見た場合の目安（実際の順位はcomputeRanksで計算）
// 占拠ギルドは必ず1位。それ以外は、占拠ギルドを除いた中でLvの高い英霊を取った順に2位から。
// ボスなし参加（ex＝英霊がいない門などから入ったギルド）は、その後ろに実際の参加順で続ける
// （例：参加が占拠ギルド＋ボスなし参加の2ギルドだけなら、ボスなし参加は2位になる）。
function computeRanks(r){
  const ranks={};
  if(r.occ) ranks[r.occ]=1;
  const byGuild={};
  slots(r.c).forEach(sl=>{
    if(r.noCalc&&r.noCalc[sl.lv]) return; // 牽制のみ（門は塗ったが入場しない）ため計算対象外
    const g=(r.a||{})[sl.lv]; if(!g||g===r.occ) return;
    if(!(g in byGuild) || sl.lv>byGuild[g]) byGuild[g]=sl.lv;
  });
  const ordered=Object.keys(byGuild).sort((a,b)=>byGuild[b]-byGuild[a]);
  let rk=r.occ?2:1;
  ordered.forEach(g=>{ if(!(g in ranks)){ranks[g]=rk; rk++;} });
  (r.ex||[]).forEach(g=>{
    if(!g||(g in ranks)) return;
    ranks[g]=rk; rk++;
  });
  return ranks;
}
function reward(castleLv,rank){
  const t=S.rewards[castleLv]||S.rewards[1];
  return t[Math.min(rank,t.length)-1]||[0,0,0];
}

// 城ごとに使われているギルドの集合（占拠＋各門＋ボスなし参加）
function usedGuilds(r){
  const s=new Set();
  if(r.occ) s.add(r.occ);
  Object.values(r.a||{}).forEach(g=>{if(g)s.add(g);});
  (r.ex||[]).forEach(g=>{if(g)s.add(g);});
  return s;
}
// その城戦（日）全体で使われているギルドの集合（各城のusedGuildsを合算）。
// 「この日に入るはずのギルド」がどこにも出てきていないかのチェックに使う
function battleGuildsUsed(B){
  const s=new Set();
  B.rows.forEach(r=>{usedGuilds(r).forEach(g=>s.add(g));});
  return s;
}
function capOf(j){return j==='帝翼' ? 6 : 4;}
// newVal を curVal の代わりに入れてよいか判定し、よければ applyFn(newVal) を実行
function tryAssign(r,newVal,curVal,applyFn){
  if(newVal && newVal!==curVal){
    const used=usedGuilds(r); used.delete(curVal||'\0');
    if(!used.has(newVal) && used.size>=capOf(r.c)){
      alert((S.lang==='zh'?'此城池最多只能有':S.lang==='ko'?'이 성은 최대':'この城は最大')+capOf(r.c)+
        (S.lang==='zh'?'個公會（含佔領公會）。':S.lang==='ko'?'개 길드까지입니다（점령 길드 포함）。':'ギルドまでです（占拠ギルドを含む）。'));
      render(); return;
    }
  }
  applyFn(newVal);
}

// 占拠ギルド＝必ず1位、それ以外はLvの高い英霊を取った順（computeRanks）で集計する
function tally(){
  const m={};
  const get=n=>m[n]||(m[n]={n:n,bp:0,bx:0,tk:0,r:[0,0,0,0,0]});
  S.battles.forEach(b=>{
    b.rows.forEach(r=>{
      const clv=(CITY[r.c]||{}).lv||1;
      const ranks=computeRanks(r);
      Object.keys(ranks).forEach(g=>{
        const rk=ranks[g], rw=reward(clv,rk), o=get(g);
        o.bp+=rw[0];o.bx+=rw[1];o.tk+=rw[2];o.r[Math.min(rk,5)-1]++;
      });
    });
  });
  return Object.values(m).sort((a,b)=>b.tk-a.tk||b.bp-a.bp);
}

function battleCard(B){
  const open=expanded.has(B.id);
  const card=el('<div class="card"></div>');
  const h=el('<div class="row" style="justify-content:space-between;cursor:pointer"></div>');
  const left=el('<div class="row" style="flex:1"></div>');
  const chk=document.createElement('input'); chk.type='checkbox'; chk.checked=!!B.chk;
  chk.onclick=(e)=>{e.stopPropagation();};
  chk.onchange=()=>{B.chk=chk.checked;save();};
  left.appendChild(chk);
  left.appendChild(el('<div><b>'+(B.date||'----')+'</b> <span class="muted small">'+B.rows.length+(S.lang==='zh'?'座城池':S.lang==='ko'?'개 성':'城')+
    (B.author?(' ・ '+B.author):'')+'</span></div>'));
  h.appendChild(left);
  const arrow=el('<div style="font-size:18px">'+(open?'▾':'▸')+'</div>');
  h.appendChild(arrow);
  h.onclick=()=>{if(open)expanded.delete(B.id);else expanded.add(B.id);render();};
  card.appendChild(h);

  // 「この日に入るはずのギルド」を選んでいて、実際の予定表のどこにも名前が出てこない場合は、
  // 折り畳んだままでも気づけるように見出しのすぐ下に警告を出す（選ばなければ何も出ない・任意機能）
  const missing=(B.expect||[]).filter(g=>!battleGuildsUsed(B).has(g));
  if(missing.length){
    card.appendChild(el('<div class="warnbox" style="margin-top:6px">'+T('expectMissing')+'：'+missing.join('、')+'</div>'));
  }

  if(!open) return card;

  const c2=el('<div style="margin-top:10px"></div>');
  const rd=el('<div class="row"></div>');
  const di=document.createElement('input'); di.type='date'; di.value=B.date||'';
  di.onchange=()=>{B.date=di.value;save();render();};
  rd.appendChild(el('<span class="muted">'+T('date')+'</span>')); rd.appendChild(di);
  const au=document.createElement('input'); au.type='text'; au.placeholder=(S.lang==='zh'?'輸入者（選填）':S.lang==='ko'?'입력자（선택）':'入力者（任意）');
  au.value=B.author||''; au.style.width='120px';
  au.onchange=()=>{B.author=au.value.trim();save();render();};
  rd.appendChild(au);
  const dl=el('<button class="b d">'+T('del')+'</button>');
  dl.onclick=()=>{if(confirm(T('confirmDel'))){S.battles=S.battles.filter(x=>x.id!==B.id);save();render();}};
  rd.appendChild(dl);
  const pg1=el('<button class="b g">'+(S.lang==='zh'?'入場表':S.lang==='ko'?'입장표':'入場表')+'</button>'); pg1.onclick=()=>exportPNG([B]); rd.appendChild(pg1);
  const pg2=el('<button class="b g">'+(S.lang==='zh'?'門配置圖':S.lang==='ko'?'문 배치도':'門配置図')+'</button>'); pg2.onclick=()=>exportGatePNG([B]); rd.appendChild(pg2);
  c2.appendChild(rd);

  // この日に入るはずのギルドを選ぶ（任意）。選んでも選ばなくても入力自体には影響しない
  const exp=el('<div class="row" style="margin-top:6px;flex-wrap:wrap;align-items:center"></div>');
  exp.appendChild(el('<span class="muted small" style="margin-right:4px">'+T('expectLabel')+'</span>'));
  (B.expect||[]).forEach((g,i)=>{
    const p=el('<span class="pill"><i style="background:'+gcolor(g)+'"></i>'+g+'<button>✕</button></span>');
    p.querySelector('button').onclick=()=>{B.expect.splice(i,1);save();render();};
    exp.appendChild(p);
  });
  const expAdd=guildSelect('',v=>{if(!v)return; B.expect=B.expect||[]; if(!B.expect.includes(v))B.expect.push(v); save();render();});
  exp.appendChild(expAdd);
  c2.appendChild(exp);

  // プリセット：毎回選び直さなくていいように、顔ぶれに名前を付けて保存・呼び出しできるようにする
  const pr=el('<div class="row" style="margin-top:4px;flex-wrap:wrap;align-items:center"></div>');
  const psel=document.createElement('select');
  psel.appendChild(new Option('— '+T('presetPick')+' —',''));
  (S.expectPresets||[]).forEach(p=>psel.appendChild(new Option(p.name+'（'+p.guilds.length+T('presetGuildsCount')+'）',p.id)));
  psel.onchange=()=>{
    if(!psel.value)return;
    const p=(S.expectPresets||[]).find(x=>x.id===psel.value);
    if(p){ B.expect=p.guilds.slice(); save(); render(); }
  };
  pr.appendChild(psel);
  const psave=el('<button class="b">💾 '+T('presetSave')+'</button>');
  psave.onclick=()=>{
    const name=prompt(T('presetNamePrompt'),'');
    if(!name||!name.trim())return;
    const nm=name.trim();
    S.expectPresets=S.expectPresets||[];
    const existing=S.expectPresets.find(p=>p.name===nm);
    if(existing){
      if(!confirm('「'+nm+T('presetOverwrite'))) return;
      existing.guilds=(B.expect||[]).slice();
    } else {
      S.expectPresets.push({id:uid(), name:nm, guilds:(B.expect||[]).slice()});
    }
    save(); render(); toast('✓ '+T('saved'));
  };
  pr.appendChild(psave);
  c2.appendChild(pr);

  const pidx = openProv[B.id]===undefined ? 0 : openProv[B.id];
  c2.appendChild(provPills(pidx, i=>{openProv[B.id]=i; render();}));
  const cs=document.createElement('select');
  (BYPROV[pidx]||[]).forEach(c=>cs.appendChild(new Option(cname(c.j)+'（Lv'+c.lv+'）',c.j)));
  const ra=el('<div class="row" style="margin-top:6px"></div>');
  const ab=el('<button class="b p">'+T('addCastle')+'</button>');
  ab.onclick=()=>{if(!cs.value)return; B.rows.unshift({c:cs.value,occ:'',a:{},ex:[],shot:''});save();render();};
  ra.appendChild(cs);ra.appendChild(ab); c2.appendChild(ra);
  card.appendChild(c2);

  B.rows.forEach((r,idx)=>card.appendChild(rowCard(B,r,idx)));
  return card;
}
function fileToImage(file,cb){
  const img=new Image(); const rd=new FileReader();
  rd.onload=()=>{img.onload=()=>cb(img);img.src=rd.result;};
  rd.readAsDataURL(file);
}
function rowCard(B,r,idx){
  const c=CITY[r.c]||{lv:1};
  const pc=SEED.col[c.p]||'#ddd';
  const card=el('<div class="card" style="border-left:5px solid '+pc+'"></div>');
  const h=el('<div class="row" style="justify-content:space-between"></div>');
  h.appendChild(el('<div><span class="lvb">Lv'+c.lv+'</span> <b>'+cname(r.c)+'</b><div class="muted">'+cname3(r.c)+'</div></div>'));
  const x=el('<button class="b d">✕</button>');
  x.onclick=()=>{B.rows.splice(idx,1);save();render();};
  h.appendChild(x); card.appendChild(h);

  if(!complete(r.c)) card.appendChild(el('<div class="warnbox">⚠ '+T('incomplete')+'</div>'));

  const oc=el('<div class="slot"></div>');
  oc.appendChild(el('<div class="lab"><b>'+T('occupier')+'</b></div>'));
  oc.appendChild(guildSelect(r.occ,v=>{tryAssign(r,v,r.occ,val=>{r.occ=val;save();render();});}));
  card.appendChild(oc);

  slots(r.c).forEach(sl=>{
    const s=el('<div class="slot" style="flex-wrap:wrap"></div>');
    const where = sl.g ? ('<span class="gate">'+sl.g+'</span>'+(sl.st?' ★':'')) : '<span class="closed">'+T('closed')+'</span>';
    s.appendChild(el('<div class="lab"><b>Lv'+sl.lv+'</b>'+facn(sl.ty)+' '+where+'</div>'));
    const cur=(r.a||{})[sl.lv];
    s.appendChild(guildSelect(cur,v=>{tryAssign(r,v,cur,val=>{r.a=r.a||{};r.a[sl.lv]=val;
      if(!val && r.noCalc) delete r.noCalc[sl.lv]; // ギルド割当を外したら牽制フラグも一緒に外す
      save();render();});}));
    // 牽制のみ（門は塗るが実際には入場しない）：予定表には表示するが、報酬計算からは除外する
    const dc=document.createElement('input'); dc.type='checkbox';
    dc.checked=!!(r.noCalc&&r.noCalc[sl.lv]); dc.disabled=!cur;
    const dl=el('<label class="small" style="display:flex;align-items:center;gap:4px;flex:0 0 100%;margin:2px 0 0 102px;opacity:'+(cur?'1':'.5')+'">'+T('decoy')+'</label>');
    dl.prepend(dc);
    dc.onchange=()=>{r.noCalc=r.noCalc||{}; if(dc.checked) r.noCalc[sl.lv]=true; else delete r.noCalc[sl.lv]; save();render();};
    s.appendChild(dl);
    card.appendChild(s);
  });

  const ex=el('<div class="slot" style="align-items:flex-start"></div>');
  const exl=el('<div class="lab"><b>'+T('noboss')+'</b>'+T('place5')+'</div>');
  ex.appendChild(exl);
  const exw=el('<div style="flex:1"></div>');
  (r.ex||[]).forEach((g,i)=>{
    const p=el('<span class="pill"><i style="background:'+gcolor(g)+'"></i>'+g+'<button>✕</button></span>');
    p.querySelector('button').onclick=()=>{r.ex.splice(i,1);save();render();};
    exw.appendChild(p);
  });
  const add=guildSelect('',v=>{if(!v)return;tryAssign(r,v,'',val=>{r.ex=r.ex||[];if(!r.ex.includes(val))r.ex.push(val);save();render();});});
  exw.appendChild(add); ex.appendChild(exw); card.appendChild(ex);

  // 結果スクショ添付（任意・順位修正の目安用。自動で数値には反映されません）
  const shotRow=el('<div class="slot" style="align-items:flex-start"></div>');
  shotRow.appendChild(el('<div class="lab"><b>'+(S.lang==='zh'?'結果截圖':S.lang==='ko'?'결과 스샷':'結果スクショ')+'</b>'+(S.lang==='zh'?'（選填・僅供參考，不會自動反映數字）':S.lang==='ko'?'（선택・참고용, 숫자에 자동 반영되지 않음）':'（任意・見比べ用の参考画像です。数字は下のプルダウンで直してください）')+'</div>'));
  const shotWrap=el('<div style="flex:1"></div>');
  if(r.shot){
    const th=el('<img src="'+r.shot+'" style="max-width:120px;border-radius:8px;border:1px solid var(--line);display:block;margin-bottom:6px;cursor:pointer">');
    th.onclick=()=>window.open(r.shot,'_blank');
    shotWrap.appendChild(th);
    shotWrap.appendChild(el('<div class="small" style="color:var(--ok);margin-bottom:4px">✓ '+(S.lang==='zh'?'已附加':S.lang==='ko'?'첨부됨':'添付済み')+'</div>'));
    const rm=el('<button class="b d">✕</button>'); rm.onclick=()=>{r.shot='';save();render();};
    shotWrap.appendChild(rm);
  } else {
    const stEl=el('<div class="small muted" style="margin-bottom:4px"></div>');
    shotWrap.appendChild(stEl);
    const handleShot=(f)=>{
      if(!f)return;
      stEl.textContent=(S.lang==='zh'?'處理中…':S.lang==='ko'?'처리 중…':'処理中…');
      fileToImage(f,img=>{
        const mw=900, sc=Math.min(1,mw/img.width);
        const cv=document.createElement('canvas'); cv.width=img.width*sc; cv.height=img.height*sc;
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        r.shot=cv.toDataURL('image/jpeg',0.7); save(); render();
        toast('✓ '+(S.lang==='zh'?'已附加':S.lang==='ko'?'첨부됨':'添付しました'));
      });
    };
    const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*';
    fi.onchange=e=>handleShot(e.target.files[0]);
    shotWrap.appendChild(fi);
    // クリップボードからの貼り付けにも対応（①ここにフォーカスしてCtrl+V、②ボタンで直接読み取り、の2通り）
    const pasteBox=el('<div tabindex="0" class="small muted" style="border:1px dashed var(--line);border-radius:8px;padding:8px;margin-top:6px;cursor:text;outline:none">'+
      (S.lang==='zh'?'點這裡後貼上（Ctrl+V／⌘+V）':S.lang==='ko'?'여기를 클릭한 뒤 붙여넣기（Ctrl+V）':'ここをタップしてから貼り付け（Ctrl+V）')+'</div>');
    pasteBox.addEventListener('paste',e=>{
      const items=(e.clipboardData||window.clipboardData||{}).items||[];
      for(const it of items){
        if(it.type&&it.type.indexOf('image/')===0){ const f=it.getAsFile(); if(f){handleShot(f); e.preventDefault();} break; }
      }
    });
    shotWrap.appendChild(pasteBox);
    const pasteBtn=el('<button class="b" type="button" style="margin-top:6px">📋 '+
      (S.lang==='zh'?'從剪貼簿貼上':S.lang==='ko'?'클립보드에서 붙여넣기':'クリップボードから貼り付け')+'</button>');
    pasteBtn.onclick=async()=>{
      try{
        const items=await navigator.clipboard.read();
        let found=false;
        for(const item of items){
          const type=item.types.find(t=>t.indexOf('image/')===0);
          if(type){ found=true; handleShot(await item.getType(type)); break; }
        }
        if(!found) alert(S.lang==='zh'?'剪貼簿裡沒有圖片':S.lang==='ko'?'클립보드에 이미지가 없습니다':'クリップボードに画像が見つかりませんでした');
      }catch(err){
        alert(S.lang==='zh'?'無法讀取剪貼簿（此瀏覽器可能不支援，或未授權）':S.lang==='ko'?'클립보드를 읽을 수 없습니다（브라우저 미지원 또는 권한 없음）':'クリップボードを読み取れませんでした（このブラウザが非対応か、権限が許可されていない可能性があります）');
      }
    };
    shotWrap.appendChild(pasteBtn);
  }
  shotRow.appendChild(shotWrap); card.appendChild(shotRow);

  // この城の報酬プレビュー（占拠ギルド＝1位、以下Lvの高い順）
  const ranks=computeRanks(r);
  const rows=Object.keys(ranks).sort((a,b)=>ranks[a]-ranks[b])
    .map(g=>{const rk=ranks[g],w=reward(c.lv,rk);return [(rk>=5?T('place5'):rk+'位'),g,w];});
  if(rows.length){
    let t='<table><tr><th>'+T('rank')+'</th><th>'+T('guild')+'</th><th class="num">'+T('boxp')+'</th><th class="num">'+T('box')+'</th><th class="num">'+T('ticket')+'</th></tr>';
    rows.forEach(x=>{t+='<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td class="num">'+x[2][0]+'</td><td class="num">'+x[2][1]+'</td><td class="num">'+x[2][2]+'</td></tr>';});
    t+='</table>';
    card.appendChild(el('<div class="scroll" style="margin-top:8px">'+t+'</div>'));
  }
  return card;
}

function renderSum(){
  const P=document.getElementById('pane-sum');
  const t=tally();
  if(!t.length){P.appendChild(el('<div class="card muted">'+T('noData')+'</div>'));return;}
  let h='<div class="card"><h2>'+T('total')+'</h2><div class="scroll"><table><tr><th>'+T('guild')+
    '</th><th class="num">'+T('boxp')+'</th><th class="num">'+T('box')+'</th><th class="num">'+T('ticket')+
    '</th><th class="num">'+(S.lang==='zh'?'名次次數(1/2/3/4/5+)':S.lang==='ko'?'순위 횟수(1/2/3/4/5+)':'順位の回数(1位/2位/3位/4位/5位+)')+'</th></tr>';
  t.forEach(o=>{h+='<tr><td><span class="chip" style="background:'+gcolor(o.n)+'">'+o.n+'</span></td>'+
    '<td class="num">'+o.bp+'</td><td class="num">'+o.bx+'</td><td class="num">'+o.tk+'</td>'+
    '<td class="num small">'+o.r.join('/')+'</td></tr>';});
  h+='</table></div></div>';
  P.appendChild(el(h));

  let b='<div class="card"><h2>'+T('breakdown')+'</h2>';
  S.battles.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(bt=>{
    const m={};
    // 合計タブと同じcomputeRanks（占拠ギルド優先＋ボスなし参加は実際の参加順）で計算する。
    // 以前はここだけ別の簡易計算（Lvから順位を逆算）をしていて、合計タブの数字とズレる原因になっていた
    bt.rows.forEach(r=>{const clv=(CITY[r.c]||{}).lv||1;
      const ranks=computeRanks(r);
      Object.keys(ranks).forEach(g=>{const w=reward(clv,ranks[g]);
        m[g]=m[g]||[0,0,0];m[g][0]+=w[0];m[g][1]+=w[1];m[g][2]+=w[2];});});
    const ks=Object.keys(m).sort((x,y)=>m[y][2]-m[x][2]);
    b+='<div class="sep"></div><div class="small"><b>'+(bt.date||'----')+'</b>（'+bt.rows.length+'）</div>';
    if(!ks.length){b+='<div class="muted small">'+T('noData')+'</div>';}
    else{b+='<div class="scroll"><table>';
      ks.forEach(k=>{b+='<tr><td>'+k+'</td><td class="num">'+m[k][0]+'</td><td class="num">'+m[k][1]+'</td><td class="num">'+m[k][2]+'</td></tr>';});
      b+='</table></div>';}
  });
  b+='</div>';
  P.appendChild(el(b));
}

function castleCard(j){
  const ci=CITY[j], b=S.boss[j]||(S.boss[j]={s:[],ng:4});
  const pc=SEED.col[ci.p]||'#ddd';
  const card=el('<div class="card" style="border-left:5px solid '+pc+'"></div>');
  card.appendChild(el('<div><span class="lvb">Lv'+ci.lv+'</span> <b>'+cname(j)+'</b> <span class="muted">'+pname(ci.p)+'</span><div class="muted">'+cname3(j)+'</div></div>'));
  if(!complete(j)) card.appendChild(el('<div class="warnbox">⚠ '+b.s.length+'/4</div>'));
  [4,3,2,1].forEach(lv=>{
    const sl=b.s.find(x=>x.lv===lv);
    const s=el('<div class="slot"></div>');
    s.appendChild(el('<div class="lab"><b>Lv'+lv+'</b></div>'));
    const ts=document.createElement('select');
    ts.appendChild(new Option('—',''));
    FAC.forEach((f,i)=>ts.appendChild(new Option(f[S.lang]+'／'+SPN[i][S.lang],i)));
    ts.value=sl?String(sl.ty):'';
    const gi=document.createElement('input'); gi.type='number'; gi.min=0; gi.max=19; gi.style.width='70px';
    gi.placeholder=T('closed'); gi.value=sl&&sl.g?sl.g:'';
    const st=document.createElement('input'); st.type='checkbox'; st.checked=!!(sl&&sl.st);
    const stl=el('<label class="small" style="display:flex;align-items:center;gap:3px">★</label>');
    stl.prepend(st);
    const apply=()=>{
      // 施設がまだ選ばれておらず、元々この行にデータも無い場合は、
      // 番号や★だけ入力した時点ではまだ何も確定させない
      // （保存・再描画してしまうと、入力途中の値が画面から消えてしまうため）
      if(ts.value===''&&!sl) return;
      const oldX=sl&&sl.x, oldY=sl&&sl.y; // 元々この門に座標情報があれば引き継ぐ（消さない）
      b.s=b.s.filter(x=>x.lv!==lv);
      if(ts.value!==''){
        const e={ty:+ts.value,lv:lv,g:+(gi.value||0),st:st.checked?1:0};
        if(oldX!==undefined && oldY!==undefined){e.x=oldX;e.y=oldY;}
        b.s.push(e);
      }
      save();render();
    };
    ts.onchange=apply; gi.onchange=apply; st.onchange=apply;
    s.appendChild(ts); s.appendChild(gi); s.appendChild(stl);
    card.appendChild(s);
  });
  return card;
}

/* ---------- 取り込み ---------- */
const FIX={'甘嚙み亭':'甘噛み亭','北葵向暖':'北葵向暖ゞ','彼岸花':'彼岸花開'};
const DROP=new Set(['敵人']);
function normGuild(n){n=(n||'').trim();n=FIX[n]||n;return DROP.has(n)?'':n;}
const T2J={};SEED.cities.forEach(c=>T2J[c.t]=c.j);
const GATEHINT={}; // 城 -> 英霊未記録の★門（位置あり）。4体目の自動推測をその門に結びつけるため
function importGateMap(o){
  const gm=o.gm||o;
  Object.keys(gm).forEach(t=>{
    const j=T2J[t]||(CITY[t]?t:null); if(!j)return;
    const gates=(gm[t].gates)||[];
    const s=[];
    gates.forEach(g=>{if(g.sp)s.push({ty:g.sp.ty,lv:g.sp.lv,g:g.n,st:g.star?1:0,x:g.x,y:g.y});});
    // 実在する門は全部（英霊が分かっていない門も含む）覚えておく。図に描く時に使う
    const all=gates.filter(g=>g.x!==undefined&&g.y!==undefined)
      .map(g=>({g:g.n,x:g.x,y:g.y,st:g.star?1:0}));
    if(s.length){S.boss[j]={s:s,ng:gates.length,all:all};}
    else if(all.length && S.boss[j]){ S.boss[j].all=all; }
    const blankStar=gates.find(g=>g.star && !g.sp);
    if(blankStar) GATEHINT[j]={g:blankStar.n,x:blankStar.x,y:blankStar.y};
    gates.forEach(g=>{const n=normGuild(g.fg);if(n)addGuild(n);});
  });
  (o.guilds||[]).forEach(g=>{const n=normGuild(g.n||g.name||g);if(n)addGuild(n,g.c||g.color);});
  autofill();
}
function importCastlePlan(o){
  const gc=o.gcol||{};
  Object.keys(gc).forEach(n=>{const x=normGuild(n);if(x)addGuild(x,gc[n]);});
  Object.keys(o.assign||{}).forEach(c=>{const x=normGuild(o.assign[c]);if(x)addGuild(x);});
}
function autofill(){ // 3体わかっていれば4体目を推定。位置未記録の★門があれば、そこが4体目と分かるので座標も付ける
  Object.keys(S.boss).forEach(j=>{
    const b=S.boss[j],s=b.s||[];
    if(s.length!==3)return;
    const ty=s.map(x=>x.ty),lv=s.map(x=>x.lv);
    if(new Set(ty).size!==3||new Set(lv).size!==3)return;
    const mty=[0,1,2,3].find(x=>!ty.includes(x)), mlv=[1,2,3,4].find(x=>!lv.includes(x));
    const hint=GATEHINT[j];
    const e={ty:mty,lv:mlv,g:0,st:0,auto:1};
    if(hint){ e.g=hint.g; e.st=1; e.x=hint.x; e.y=hint.y; }
    s.push(e);
  });
}

async function doPull(loud){
  try{

    if(o&&o.u&&o.u>(S.u||0)){Object.assign(S,o);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}

  h3(C[1],CW[1],['開放的城池','開放される城','개방되는 성']);

  let y=top+HH, lastDate=null;

      box(PAD,y,W-2*PAD,GH,'#E8A0B4');

/* ---------- PNG出力（門配置＋担当ギルド図） ---------- */
const FACCOL=['#E8A0B4','#7FB07A','#A9C6F0','#E0A33A']; // 工場/書院/医療院/武器庫
function drawCastleIcon(x,cx,cy){
  const w=34,h=26,top=cy-h/2;
  x.fillStyle='#8C9A7A'; x.strokeStyle='#fff'; x.lineWidth=1.5;
  x.beginPath(); x.rect(cx-w/2,top,w,h); x.fill(); x.stroke();
  const teeth=4, tw=w/teeth;
  for(let i=0;i<teeth;i+=2){ x.fillRect(cx-w/2+i*tw, top-7, tw, 7); x.strokeRect(cx-w/2+i*tw, top-7, tw, 7); }
  x.fillStyle='#fff'; x.fillRect(cx-3, top+h*0.4, 6, h*0.5);
  x.strokeStyle='#8C9A7A'; x.lineWidth=1.5; x.beginPath(); x.moveTo(cx,top-7); x.lineTo(cx,top-16); x.stroke();
  x.fillStyle='#E8A0B4'; x.beginPath(); x.moveTo(cx,top-16); x.lineTo(cx+9,top-13); x.lineTo(cx,top-10); x.closePath(); x.fill();
}
// 矩形どうしが重なっているか
function rectHit(a,b){ return a.x1<b.x2 && a.x2>b.x1 && a.y1<b.y2 && a.y2>b.y1; }
function drawGateCluster(x,px,py,color,numText,star,s){
  const diamond=(cx,cy)=>{ x.beginPath(); x.moveTo(cx,cy-s); x.lineTo(cx+s,cy); x.lineTo(cx,cy+s); x.lineTo(cx-s,cy); x.closePath(); };
  const offs=[[0,-s*1.05],[ -s*1.05,0],[0,0],[s*1.05,0],[0,s*1.05]];
  x.fillStyle=color+'33'; x.strokeStyle=color;
  offs.forEach(([dx,dy])=>{ x.lineWidth=1.2; diamond(px+dx,py+dy); x.fill(); x.stroke(); });
  const bx=px+s*1.3, by=py-s*1.3, br=Math.max(9,s*0.95);
  x.fillStyle='#fff'; x.strokeStyle=color; x.lineWidth=2;
  x.beginPath(); x.arc(bx,by,br,0,Math.PI*2); x.fill(); x.stroke();
  // 門番号は常に表示（専属スキル付きでも番号は変わらない）。★は小さな印として右上に添えるだけ
  x.font='bold '+Math.max(10,Math.round(s*0.95))+'px system-ui'; x.fillStyle=color; x.textAlign='center'; x.textBaseline='middle';
  x.fillText(numText, bx, by);
  if(star){
    const sx=bx+br*0.8, sy=by-br*0.8, sr=Math.max(4,br*0.42);
    x.fillStyle='#E0A33A'; x.strokeStyle='#fff'; x.lineWidth=1;
    x.beginPath();
    for(let k=0;k<5;k++){
      const ang=-Math.PI/2+k*(Math.PI*2/5), ang2=ang+Math.PI/5;
      x[k===0?'moveTo':'lineTo'](sx+Math.cos(ang)*sr, sy+Math.sin(ang)*sr);
      x.lineTo(sx+Math.cos(ang2)*sr*0.42, sy+Math.sin(ang2)*sr*0.42);
    }
    x.closePath(); x.fill(); x.stroke();
  }
}
function labelOutline(x,t,px,py,size,fill){
  x.font='bold '+size+'px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif';
  x.textAlign='center';x.textBaseline='middle';
  x.lineWidth=Math.max(3,size*0.3); x.strokeStyle='#fff'; x.lineJoin='round';

function exportGatePNG(battles){
  const flat=[]; battles.forEach(B=>B.rows.forEach(r=>flat.push({date:B.date,r})));
  if(!flat.length){alert(T('noData'));return;}
  const dpr=2, TILE=360, GAP=16, TOPM=34, COLS=Math.min(3,flat.length);
  const ROWSn=Math.ceil(flat.length/COLS);
  const W=COLS*TILE+(COLS+1)*GAP;
  // 施設の凡例は、どの国の人が見ても分かるように「繁體字｜日本語｜韓国語」の3言語表記にする。
  // 文字数が伸びる分、実際の文字幅を測って列幅・行数・下部の余白を動的に決める
  const LEGFONT='13px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif';
  const legLabels=FAC.map(f=>f.zh+'｜'+f.ja+'｜'+f.ko);
  const mcv=document.createElement('canvas'); const mx=mcv.getContext('2d'); mx.font=LEGFONT;
  const legW=Math.max(...legLabels.map(t=>mx.measureText(t).width))+34;
  const legPerRow=Math.max(1,Math.floor((W-20)/legW));
  const legRows=Math.ceil(FAC.length/legPerRow);
  const BOTM=legRows*20+24;
  const H=ROWSn*TILE+(ROWSn+1)*GAP+TOPM+BOTM;
  let cv=document.getElementById('cv2');
  if(!cv){cv=document.createElement('canvas');cv.id='cv2';cv.style.display='none';document.body.appendChild(cv);}
  cv.width=W*dpr; cv.height=H*dpr; const x=cv.getContext('2d'); x.scale(dpr,dpr);
  x.fillStyle='#FBF7F2'; x.fillRect(0,0,W,H);

  flat.forEach(({date,r},i)=>{
    const col=i%COLS, row=Math.floor(i/COLS);
    const tx=GAP+col*(TILE+GAP), ty=TOPM+GAP+row*(TILE+GAP);
    const ci=CITY[r.c]||{lv:1,j:r.c,t:r.c,k:r.c};
    x.fillStyle='#fff'; x.strokeStyle='#E7DED2'; x.lineWidth=1;
    x.fillRect(tx,ty,TILE,TILE); x.strokeRect(tx,ty,TILE,TILE);
    x.font='bold 15px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif';
    x.fillStyle='#3B332C'; x.textAlign='left'; x.textBaseline='alphabetic';
    x.fillText(date||'', tx+10, ty+19);
    x.fillText('《'+ci.t+'｜'+ci.j+'｜'+ci.k+'》 Lv'+ci.lv, tx+10, ty+38);

    const cx=tx+TILE/2, cy=ty+TILE/2+16, scale=58;

    const b=S.boss[r.c]||{s:[],all:[]};
    const sl=slots(r.c);
    // 実在する門はすべて描く。英霊が分かっている門は施設色＋ギルド名、
    // 分かっていない門は灰色のニュートラル表示（番号だけ）にする
    const known=new Map(sl.filter(s=>s.x!==undefined&&s.y!==undefined).map(s=>[s.g+'#'+(s.st?1:0), s]));
    const baseGates = (b.all&&b.all.length) ? b.all : sl.filter(s=>s.x!==undefined&&s.y!==undefined).map(s=>({g:s.g,x:s.x,y:s.y,st:s.st}));
    const pts=baseGates.map(gt=>{
      const m=sl.find(s=>s.g===gt.g && !!s.st===!!gt.st && s.x!==undefined);
      const guild = m?((r.a||{})[m.lv]||''):'';
      const decoy = !!(m && guild && r.noCalc && r.noCalc[m.lv]);
      return {px:cx+gt.x*scale, py:cy+gt.y*scale, g:gt.g, st:!!gt.st,
        ty: m?m.ty:-1, guild, decoy, known:!!m};
    });

    // 門どうしが近いほどマスを小さくして、菱形クラスタが重ならないようにする
    let minD=Infinity;
    for(let a=0;a<pts.length;a++)for(let bIdx=a+1;bIdx<pts.length;bIdx++){
      const d=Math.hypot(pts[a].px-pts[bIdx].px, pts[a].py-pts[bIdx].py); if(d<minD) minD=d;
    }
    const s=Math.max(7, Math.min(13, isFinite(minD)?minD/2.6-2:13));

    drawCastleIcon(x,cx,cy);
    const occupied=[]; // 既に置いた矩形（マス・バッジ・ラベル）
    pts.forEach(p=>occupied.push({x1:p.px-s*2.2,x2:p.px+s*2.6,y1:p.py-s*2.6,y2:p.py+s*2.2}));
    occupied.push({x1:cx-20,x2:cx+20,y1:cy-24,y2:cy+16}); // 城アイコン自体も避ける

    pts.forEach(p=>drawGateCluster(x,p.px,p.py, p.known?FACCOL[p.ty]:'#C9BEAE', String(p.g), p.st, s));

    // ラベル（ギルド名）は、割り当てが決まっている門にだけ置く。既に置いたものと重ならない位置を探す
    const fontSize=Math.max(12,Math.min(17,s+3));
    pts.filter(p=>p.guild).forEach(p=>{
      const text=p.decoy?('※'+p.guild):p.guild;
      x.font='bold '+fontSize+'px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif';
      const tw=x.measureText(text).width, th=fontSize+4;
      const cands=[
        [0, s*2.2],[0,-s*2.2-th*0.6],[s*2.4+tw/2-s*0.5, s*0.3],[-(s*2.4+tw/2-s*0.5), s*0.3],
        [0, s*3.4],[0,-s*3.4-th*0.6],[s*3.2+tw/2, -s*1.2],[-(s*3.2+tw/2), -s*1.2],
        [0, s*4.6],[0,-s*4.6-th*0.6]
      ];
      let placed=null;
      for(const [dx,dy] of cands){
        const lx=p.px+dx, ly=p.py+dy;
        const rect={x1:lx-tw/2-3,x2:lx+tw/2+3,y1:ly-th/2,y2:ly+th/2};
        if(rect.x1<tx+4||rect.x2>tx+TILE-4||rect.y1<ty+44||rect.y2>ty+TILE-4) continue;
        if(occupied.some(o=>rectHit(o,rect))) continue;
        placed={lx,ly,rect}; break;
      }
      if(!placed){ const lx=p.px, ly=p.py+s*2.2; placed={lx,ly,rect:{x1:lx-tw/2-3,x2:lx+tw/2+3,y1:ly-th/2,y2:ly+th/2}}; }
      occupied.push(placed.rect);
      labelOutline(x, text, placed.lx, placed.ly, fontSize, p.decoy?'#8A7D6E':'#2b3a67');
    });

    const noGate=sl.filter(s=>s.x===undefined||s.y===undefined).map(s=>({s,g:(r.a||{})[s.lv]||'',decoy:!!(r.noCalc&&r.noCalc[s.lv])}));
    if(!pts.length){
      x.font='13px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif';
      x.fillStyle='#B0A695'; x.textAlign='center'; x.textBaseline='middle';
      x.fillText('（尚未登記門的位置｜門の位置データ未登録｜문 위치 미등록）', cx, cy+56);
    }
    if(noGate.length){
      x.font='13px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif';
      x.fillStyle='#8A7D6E'; x.textAlign='left';
      let ly=ty+TILE-16*noGate.length-8;
      noGate.forEach(({s,g,decoy})=>{ x.fillText(facn3(s.ty)+(g?' → '+(decoy?'※':'')+g:'（未指定｜未指定｜미지정）'), tx+10, ly); ly+=16; });
    }
  });
  x.font=LEGFONT; x.textAlign='left'; x.textBaseline='middle';
  const legendTop=TOPM+ROWSn*(TILE+GAP)+14;
  FAC.forEach((f,i)=>{
    const col=i%legPerRow, row=Math.floor(i/legPerRow);
    const lx=10+col*legW, ly=legendTop+10+row*20;
    x.fillStyle=FACCOL[i]; x.beginPath(); x.arc(lx+7,ly,7,0,7); x.fill();
    x.fillStyle='#3B332C'; x.fillText(legLabels[i], lx+19, ly);
  });

  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='gate-plan.png';a.click();});
}

/* ---------- 起動 ---------- */
document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render();});
load(); render();
pullGateMapLive(false);
doPull(false).then(()=>{
  // 同期データが本当に空っぽの初回だけ、デフォルトのギルドを入れておく
  if(!S.guilds.length){
    DEFAULT_GUILDS.forEach(n=>addGuild(n));
    save(); render();
  }
});
// 自分が今編集していない間だけ、20秒ごとに自動で最新を受信する（台帳データ＋門配置データの両方）
setInterval(()=>{if(!dirty&&!document.hidden){doPull(false);pullGateMapLive(false);}},20000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dirty){doPull(false);pullGateMapLive(false);}});
</script>
