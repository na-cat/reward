<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>報酬台帳｜獎勵台帳｜보상 장부</title>
<style>
:root{
  --bg:#FBF7F2; --card:#FFFFFF; --line:#E7DED2; --ink:#3B332C; --sub:#8A7D6E;
  --accent:#E8A0B4; --accent2:#A9C6F0; --ok:#7FB07A; --warn:#E0A33A; --bad:#D9736F;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif;
  font-size:15px;line-height:1.55}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);
  padding:10px 12px calc(env(safe-area-inset-top)*0 + 8px)}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:16px;margin:0;font-weight:700;flex:1}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px;font-size:12px;color:var(--sub)}
.langs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
nav button{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--sub)}
nav button.on{background:var(--ink);border-color:var(--ink);color:#fff}
main{padding:12px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px}
.muted{color:var(--sub);font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.b{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--ink)}
button.p{background:var(--accent);border-color:var(--accent);color:#fff}
button.g{background:var(--accent2);border-color:var(--accent2);color:#1f3350}
button.d{background:#fff;border-color:var(--bad);color:var(--bad)}
button.b:active{transform:translateY(1px)}
input,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;color:var(--ink);max-width:100%}
input[type=date]{min-width:150px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
th{color:var(--sub);font-weight:600;font-size:11px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
.lvb{background:var(--ink);color:#fff;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700}
.slot{display:flex;gap:6px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}
.slot .lab{flex:0 0 96px;font-size:12px;color:var(--sub);line-height:1.25}
.slot .lab b{display:block;color:var(--ink);font-size:12px}
.slot select{flex:1;min-width:0}
.closed{color:var(--warn);font-weight:700}
.warnbox{background:#FFF6E6;border:1px solid #F0DCB4;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.okbox{background:#EEF7EE;border:1px solid #CFE6CE;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scroll{overflow-x:auto}
.pill{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:#fff;margin:0 4px 4px 0;display:inline-flex;align-items:center;gap:6px}
.pill i{width:10px;height:10px;border-radius:999px;display:inline-block}
.pill button{border:0;background:none;color:var(--bad);font-size:14px;padding:0 2px}
.small{font-size:12px}
.sep{height:1px;background:var(--line);margin:10px 0}
.gate{display:inline-block;min-width:22px;text-align:center;background:#F3EDE4;border-radius:6px;font-size:11px;font-weight:700;padding:1px 5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1 id="ttl">報酬台帳</h1>
    <div class="langs">

    </div>
  </div>
  <nav id="nav"></nav>
</header>
<main>

/* ---------- 報酬表（城Lv → 順位ごとの[宝箱+, 宝箱, 券]） ---------- */
const DEF_REWARDS={
 1:[[1,5,300],[0,5,250],[0,3,200],[0,3,200],[0,3,200]],
 2:[[3,8,400],[0,8,350],[0,5,350],[0,5,350],[0,5,350]],
 3:[[5,15,450],[3,15,400],[1,10,350],[1,10,350],[1,10,350]],
 4:[[4,15,500],[4,15,450],[2,10,400],[2,10,400],[2,10,400]],
 5:[[5,25,650],[5,25,600],[3,15,500],[3,15,500],[3,15,500]],
 6:[[10,25,750],[7,25,700],[4,15,600],[4,15,600],[4,15,600]],

 10:[[30,35,1200],[30,35,1100],[15,30,1000],[10,20,800],[10,20,800]]
};
const PASTEL=['#F2B5C4','#9FD8B8','#A9C6F0','#F5D28C','#C8B4E8','#8FD9D4','#F0A98C','#B9DE8C',
 '#E4B0DE','#8FC4A0','#D7C9A0','#9BB8D6','#EFC2A0','#B0D2E8','#D9A9A9','#A8E0C4'];

const KEY='arl.v1';

const CITY={}, BYPROV=[];
SEED.cities.forEach(c=>{CITY[c.j]=c; (BYPROV[c.p]=BYPROV[c.p]||[]).push(c);});
function T(k){return (L[S.lang]&&L[S.lang][k])||L.ja[k]||k;}
function cname(j){const c=CITY[j];if(!c)return j;return S.lang==='zh'?c.t:S.lang==='ko'?c.k:c.j;}
function cname3(j){const c=CITY[j];if(!c)return j;return c.j+'｜'+c.t+'｜'+c.k;}
function pname(i){const p=SEED.provs[i];return S.lang==='zh'?p[0]:S.lang==='ko'?p[2]:p[1];}
function facn(t){return FAC[t][S.lang];}
function spn(t){return SPN[t][S.lang];}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1600);}

function load(){
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); Object.assign(S,o);} }catch(e){}
  if(!S.rewards) S.rewards=JSON.parse(JSON.stringify(DEF_REWARDS));
  if(!S.boss||!Object.keys(S.boss).length) S.boss=JSON.parse(JSON.stringify(SEED.boss));
  if(!S.guilds) S.guilds=[];
  if(!S.battles) S.battles=[];
}
function save(){S.u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}schedulePush();}

/* ---------- ギルド ---------- */
function gcolor(n){const g=S.guilds.find(x=>x.n===n);return g?g.c:'#EEE';}
function addGuild(n,c){
  n=(n||'').trim(); if(!n) return null;
  let g=S.guilds.find(x=>x.n===n);
  if(!g){g={n:n,c:c||PASTEL[S.guilds.length%PASTEL.length]};S.guilds.push(g);}
  return g;
}
function guildSelect(val,onch){
  const s=document.createElement('select');
  const o0=new Option(T('none'),''); s.appendChild(o0);
  S.guilds.slice().sort((a,b)=>a.n.localeCompare(b.n)).forEach(g=>s.appendChild(new Option(g.n,g.n)));
  s.appendChild(new Option('＋ '+T('add')+'…','__new'));
  s.value=val||'';
  s.onchange=()=>{
    if(s.value==='__new'){
      const n=prompt(T('guildName')); 
      if(n&&n.trim()){addGuild(n.trim());save();onch(n.trim());render();}
      else{s.value=val||'';}
      return;
    }
    onch(s.value);
  };
  return s;
}

/* ---------- 英霊枠 ---------- */
function slots(j){
  const b=S.boss[j]; if(!b) return [];
  return (b.s||[]).slice().sort((a,b)=>b.lv-a.lv);
}
function complete(j){
  const s=(S.boss[j]||{}).s||[];
  if(s.length!==4) return false;
  return new Set(s.map(x=>x.lv)).size===4 && new Set(s.map(x=>x.ty)).size===4;
}
function rankOf(lv){return 5-lv;}           // Lv4→1位 … Lv1→4位
function reward(castleLv,rank){
  const t=S.rewards[castleLv]||S.rewards[1];
  return t[Math.min(rank,t.length)-1]||[0,0,0];
}

/* ---------- 集計 ---------- */
function tally(){
  const m={};
  const get=n=>m[n]||(m[n]={n:n,bp:0,bx:0,tk:0,r:[0,0,0,0,0]});
  S.battles.forEach(b=>{
    b.rows.forEach(r=>{
      const clv=(CITY[r.c]||{}).lv||1;
      slots(r.c).forEach(sl=>{
        const g=(r.a||{})[sl.lv]; if(!g) return;
        const rk=rankOf(sl.lv), rw=reward(clv,rk), o=get(g);
        o.bp+=rw[0];o.bx+=rw[1];o.tk+=rw[2];o.r[rk-1]++;
      });
      (r.ex||[]).forEach(g=>{
        if(!g) return; const rw=reward(clv,5), o=get(g);
        o.bp+=rw[0];o.bx+=rw[1];o.tk+=rw[2];o.r[4]++;
      });
    });
  });
  return Object.values(m).sort((a,b)=>b.tk-a.tk||b.bp-a.bp);
}

  TABS.forEach(t=>{const el=document.getElementById('pane-'+t);el.style.display=t===tab?'':'none';el.innerHTML='';});
  ({plan:renderPlan,sum:renderSum,castle:renderCastle,data:renderData})[tab]();
}

function curBattle(){return S.battles.find(b=>b.id===S.cur)||null;}
function renderPlan(){

  const sel=document.createElement('select');

  const nb=el('<button class="b p">＋ '+T('newBattle')+'</button>');

  di.onchange=()=>{B.date=di.value;save();render();};
  rd.appendChild(el('<span class="muted">'+T('date')+'</span>')); rd.appendChild(di);
  const dl=el('<button class="b d">'+T('del')+'</button>');
  dl.onclick=()=>{if(confirm(T('confirmDel'))){S.battles=S.battles.filter(x=>x.id!==B.id);S.cur=null;save();render();}};
  rd.appendChild(dl);
  const pg=el('<button class="b g">'+T('png')+'</button>'); pg.onclick=()=>exportPNG(B); rd.appendChild(pg);
  c2.appendChild(rd);

  const ra=el('<div class="row" style="margin-top:8px"></div>');
  const ps=document.createElement('select');
  SEED.provs.forEach((p,i)=>ps.appendChild(new Option(pname(i),i)));
  const cs=document.createElement('select');
  const fill=()=>{cs.innerHTML='';(BYPROV[+ps.value]||[]).forEach(c=>cs.appendChild(new Option(cname(c.j)+'（Lv'+c.lv+'）',c.j)));};
  ps.onchange=fill; fill();
  const ab=el('<button class="b p">'+T('addCastle')+'</button>');
  ab.onclick=()=>{if(!cs.value)return; B.rows.push({c:cs.value,occ:'',a:{},ex:[]});save();render();};
  ra.appendChild(ps);ra.appendChild(cs);ra.appendChild(ab); c2.appendChild(ra);
  P.appendChild(c2);

  B.rows.forEach((r,idx)=>P.appendChild(rowCard(B,r,idx)));
}
function rowCard(B,r,idx){
  const c=CITY[r.c]||{lv:1};
  const card=el('<div class="card"></div>');
  const h=el('<div class="row" style="justify-content:space-between"></div>');
  h.appendChild(el('<div><span class="lvb">Lv'+c.lv+'</span> <b>'+cname(r.c)+'</b><div class="muted">'+cname3(r.c)+'</div></div>'));
  const x=el('<button class="b d">✕</button>');
  x.onclick=()=>{B.rows.splice(idx,1);save();render();};
  h.appendChild(x); card.appendChild(h);

  if(!complete(r.c)) card.appendChild(el('<div class="warnbox">⚠ '+T('incomplete')+'</div>'));

  const oc=el('<div class="slot"></div>');
  oc.appendChild(el('<div class="lab"><b>'+T('occupier')+'</b></div>'));
  oc.appendChild(guildSelect(r.occ,v=>{r.occ=v;save();render();}));
  card.appendChild(oc);

  slots(r.c).forEach(sl=>{
    const s=el('<div class="slot"></div>');
    const where = sl.g ? ('<span class="gate">'+sl.g+'</span>'+(sl.st?' ★':'')) : '<span class="closed">'+T('closed')+'</span>';
    s.appendChild(el('<div class="lab"><b>Lv'+sl.lv+'・'+(5-sl.lv)+'位</b>'+facn(sl.ty)+' '+where+'</div>'));
    s.appendChild(guildSelect((r.a||{})[sl.lv],v=>{r.a=r.a||{};r.a[sl.lv]=v;save();render();}));
    card.appendChild(s);
  });

  const ex=el('<div class="slot" style="align-items:flex-start"></div>');
  const exl=el('<div class="lab"><b>'+T('noboss')+'</b>'+T('place5')+'</div>');
  ex.appendChild(exl);
  const exw=el('<div style="flex:1"></div>');
  (r.ex||[]).forEach((g,i)=>{
    const p=el('<span class="pill"><i style="background:'+gcolor(g)+'"></i>'+g+'<button>✕</button></span>');
    p.querySelector('button').onclick=()=>{r.ex.splice(i,1);save();render();};
    exw.appendChild(p);
  });
  const add=guildSelect('',v=>{if(!v)return;r.ex=r.ex||[];if(!r.ex.includes(v))r.ex.push(v);save();render();});
  exw.appendChild(add); ex.appendChild(exw); card.appendChild(ex);

  // この城の報酬プレビュー
  const rows=[];
  slots(r.c).forEach(sl=>{const g=(r.a||{})[sl.lv];if(!g)return;const rk=5-sl.lv,w=reward(c.lv,rk);
    rows.push([rk+'位',g,w]);});
  (r.ex||[]).forEach(g=>{const w=reward(c.lv,5);rows.push([T('place5'),g,w]);});
  if(rows.length){
    let t='<table><tr><th>'+T('rank')+'</th><th>'+T('guild')+'</th><th class="num">'+T('boxp')+'</th><th class="num">'+T('box')+'</th><th class="num">'+T('ticket')+'</th></tr>';
    rows.forEach(x=>{t+='<tr><td>'+x[0]+'</td><td>'+x[1]+'</td><td class="num">'+x[2][0]+'</td><td class="num">'+x[2][1]+'</td><td class="num">'+x[2][2]+'</td></tr>';});
    t+='</table>';
    card.appendChild(el('<div class="scroll" style="margin-top:8px">'+t+'</div>'));
  }
  return card;
}

/* --- 集計 --- */
function renderSum(){
  const P=document.getElementById('pane-sum');
  const t=tally();
  if(!t.length){P.appendChild(el('<div class="card muted">'+T('noData')+'</div>'));return;}
  let h='<div class="card"><h2>'+T('total')+'</h2><div class="scroll"><table><tr><th>'+T('guild')+

    '<td class="num">'+o.bp+'</td><td class="num">'+o.bx+'</td><td class="num">'+o.tk+'</td>'+
    '<td class="num small">'+o.r.join('/')+'</td></tr>';});
  h+='</table></div></div>';
  P.appendChild(el(h));

  let b='<div class="card"><h2>'+T('breakdown')+'</h2>';
  S.battles.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).forEach(bt=>{
    const m={};
    bt.rows.forEach(r=>{const clv=(CITY[r.c]||{}).lv||1;
      slots(r.c).forEach(sl=>{const g=(r.a||{})[sl.lv];if(!g)return;const w=reward(clv,5-sl.lv);
        m[g]=m[g]||[0,0,0];m[g][0]+=w[0];m[g][1]+=w[1];m[g][2]+=w[2];});
      (r.ex||[]).forEach(g=>{const w=reward(clv,5);m[g]=m[g]||[0,0,0];m[g][0]+=w[0];m[g][1]+=w[1];m[g][2]+=w[2];});});
    const ks=Object.keys(m).sort((x,y)=>m[y][2]-m[x][2]);
    b+='<div class="sep"></div><div class="small"><b>'+(bt.date||'----')+'</b>（'+bt.rows.length+'）</div>';
    if(!ks.length){b+='<div class="muted small">'+T('noData')+'</div>';}
    else{b+='<div class="scroll"><table>';
      ks.forEach(k=>{b+='<tr><td>'+k+'</td><td class="num">'+m[k][0]+'</td><td class="num">'+m[k][1]+'</td><td class="num">'+m[k][2]+'</td></tr>';});
      b+='</table></div>';}
  });
  b+='</div>';
  P.appendChild(el(b));
}

let cprov=0, conlyBad=false;
function renderCastle(){
  const P=document.getElementById('pane-castle');
  const bad=Object.keys(S.boss).filter(j=>!complete(j));
  const c=el('<div class="card"></div>');
  c.appendChild(el('<div class="'+(bad.length?'warnbox':'okbox')+'">'+T('hint4')+'（'+bad.length+'）</div>'));
  const r=el('<div class="row"></div>');
  const ps=document.createElement('select');

  ps.value=cprov; ps.onchange=()=>{cprov=+ps.value;render();};
  r.appendChild(ps);
  const tg=el('<button class="b'+(conlyBad?' p':'')+'">⚠ '+T('incomplete')+'</button>');
  tg.onclick=()=>{conlyBad=!conlyBad;render();};
  r.appendChild(tg); c.appendChild(r); P.appendChild(c);

  let list = conlyBad ? bad.map(j=>CITY[j]).filter(Boolean) : (BYPROV[cprov]||[]);
  list.forEach(ci=>P.appendChild(castleCard(ci.j)));
}
function castleCard(j){
  const ci=CITY[j], b=S.boss[j]||(S.boss[j]={s:[],ng:4});
  const card=el('<div class="card"></div>');
  card.appendChild(el('<div><span class="lvb">Lv'+ci.lv+'</span> <b>'+cname(j)+'</b> <span class="muted">'+pname(ci.p)+'</span><div class="muted">'+cname3(j)+'</div></div>'));
  if(!complete(j)) card.appendChild(el('<div class="warnbox">⚠ '+b.s.length+'/4</div>'));
  [4,3,2,1].forEach(lv=>{
    const sl=b.s.find(x=>x.lv===lv);
    const s=el('<div class="slot"></div>');
    s.appendChild(el('<div class="lab"><b>Lv'+lv+'・'+(5-lv)+'位</b></div>'));
    const ts=document.createElement('select');
    ts.appendChild(new Option('—',''));
    FAC.forEach((f,i)=>ts.appendChild(new Option(f[S.lang]+'／'+SPN[i][S.lang],i)));
    ts.value=sl?String(sl.ty):'';
    const gi=document.createElement('input'); gi.type='number'; gi.min=0; gi.max=19; gi.style.width='70px';
    gi.placeholder=T('closed'); gi.value=sl&&sl.g?sl.g:'';
    const st=document.createElement('input'); st.type='checkbox'; st.checked=!!(sl&&sl.st);
    const stl=el('<label class="small" style="display:flex;align-items:center;gap:3px">★</label>');
    stl.prepend(st);
    const apply=()=>{
      b.s=b.s.filter(x=>x.lv!==lv);
      if(ts.value!==''){b.s.push({ty:+ts.value,lv:lv,g:+(gi.value||0),st:st.checked?1:0});}
      save();render();
    };
    ts.onchange=apply; gi.onchange=apply; st.onchange=apply;
    s.appendChild(ts); s.appendChild(gi); s.appendChild(stl);
    card.appendChild(s);
  });
  return card;
}

  ir.appendChild(mk(T('impGM'),importGateMap));
  ir.appendChild(mk(T('impCP'),importCastlePlan));
  const ex=el('<button class="b p">'+T('exp')+'</button>');
  ex.onclick=()=>{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='reward-ledger-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'.json';a.click();};
  ir.appendChild(ex); ic.appendChild(ir); P.appendChild(ic);

  // ギルド名簿
  const gc=el('<div class="card"><h2>'+T('guilds')+'（'+S.guilds.length+'）</h2></div>');
  const gw=el('<div></div>');
  S.guilds.slice().sort((a,b)=>a.n.localeCompare(b.n)).forEach(g=>{
    const p=el('<span class="pill"><i style="background:'+g.c+'"></i>'+g.n+'<button>✕</button></span>');
    p.querySelector('i').onclick=()=>{const c=prompt(T('color'),g.c);if(c){g.c=c;save();render();}};
    p.querySelector('button').onclick=()=>{if(confirm(g.n+'\n'+T('confirmDel'))){
      S.guilds=S.guilds.filter(x=>x!==g);save();render();}};
    gw.appendChild(p);
  });
  gc.appendChild(gw);
  const ga=el('<button class="b" style="margin-top:6px">＋ '+T('add')+'</button>');
  ga.onclick=()=>{const n=prompt(T('guildName'));if(n&&n.trim()){addGuild(n.trim());save();render();}};
  gc.appendChild(ga); P.appendChild(gc);

  // 報酬表
  const rc=el('<div class="card"><h2>'+T('rewards')+'</h2></div>');
  let h='<div class="scroll"><table><tr><th>'+T('castleLv')+'</th><th>'+T('rank')+'</th><th>'+T('boxp')+
    '</th><th>'+T('box')+'</th><th>'+T('ticket')+'</th></tr>';
  for(let lv=1;lv<=10;lv++){
    S.rewards[lv].forEach((w,i)=>{
      h+='<tr><td>'+(i===0?'Lv'+lv:'')+'</td><td>'+(i<4?(i+1)+'':'5+')+'</td>';
      [0,1,2].forEach(k=>{h+='<td><input data-lv="'+lv+'" data-i="'+i+'" data-k="'+k+'" type="number" style="width:64px" value="'+w[k]+'"></td>';});
      h+='</tr>';
    });
  }
  h+='</table></div>';
  const tb=el(h); rc.appendChild(tb);
  tb.querySelectorAll('input').forEach(inp=>inp.onchange=()=>{
    S.rewards[+inp.dataset.lv][+inp.dataset.i][+inp.dataset.k]=+inp.value||0;save();});
  P.appendChild(rc);

  // 全消去
  const dc=el('<div class="card"></div>');
  const db=el('<button class="b d">'+T('resetAll')+'</button>');
  db.onclick=()=>{if(confirm(T('resetAll')+'?')){localStorage.removeItem(KEY);location.reload();}};
  dc.appendChild(db); P.appendChild(dc);
}

/* ---------- 取り込み ---------- */
const FIX={'甘嚙み亭':'甘噛み亭','北葵向暖':'北葵向暖ゞ','彼岸花':'彼岸花開'};
const DROP=new Set(['敵人']);
function normGuild(n){n=(n||'').trim();n=FIX[n]||n;return DROP.has(n)?'':n;}
const T2J={};SEED.cities.forEach(c=>T2J[c.t]=c.j);
function importGateMap(o){
  const gm=o.gm||o;
  Object.keys(gm).forEach(t=>{
    const j=T2J[t]||(CITY[t]?t:null); if(!j)return;
    const gates=(gm[t].gates)||[];
    const s=[];
    gates.forEach(g=>{if(g.sp)s.push({ty:g.sp.ty,lv:g.sp.lv,g:g.n,st:g.star?1:0});});
    if(s.length){S.boss[j]={s:s,ng:gates.length};}
    gates.forEach(g=>{const n=normGuild(g.fg);if(n)addGuild(n);});
  });
  (o.guilds||[]).forEach(g=>{const n=normGuild(g.n||g.name||g);if(n)addGuild(n,g.c||g.color);});
  autofill();
}
function importCastlePlan(o){
  const gc=o.gcol||{};
  Object.keys(gc).forEach(n=>{const x=normGuild(n);if(x)addGuild(x,gc[n]);});
  Object.keys(o.assign||{}).forEach(c=>{const x=normGuild(o.assign[c]);if(x)addGuild(x);});
}
function autofill(){ // 3体わかっていれば4体目を推定
  Object.keys(S.boss).forEach(j=>{
    const b=S.boss[j],s=b.s||[];
    if(s.length!==3)return;
    const ty=s.map(x=>x.ty),lv=s.map(x=>x.lv);
    if(new Set(ty).size!==3||new Set(lv).size!==3)return;
    const mty=[0,1,2,3].find(x=>!ty.includes(x)), mlv=[1,2,3,4].find(x=>!lv.includes(x));
    s.push({ty:mty,lv:mlv,g:0,st:0,auto:1});
  });
}

/* ---------- 同期（Functions経由） ---------- */
let pt=null;
function schedulePush(){clearTimeout(pt);pt=setTimeout(()=>doPush(false),1500);}
function st(m){const e=document.getElementById('syncst');if(e)e.textContent=m;}
async function doPull(loud){
  try{
    const r=await fetch('/api/sync',{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const o=await r.json();
    if(o&&o.u&&o.u>(S.u||0)){Object.assign(S,o);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      if(loud)toast('⬇ OK');render();}
    else if(loud)toast('⬇ —');
    st('⬇ '+new Date().toLocaleTimeString());
  }catch(e){st('⬇ ✕ '+e.message); if(loud)alert('sync error: '+e.message);}
}
async function doPush(loud){
  try{
    const r=await fetch('/api/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});
    if(!r.ok)throw new Error(r.status);
    st('⬆ '+new Date().toLocaleTimeString()); if(loud)toast('⬆ OK');
  }catch(e){st('⬆ ✕ '+e.message); if(loud)alert('sync error: '+e.message);}
}

/* ---------- PNG出力（入場予定表） ---------- */
function exportPNG(B){
  const rows=B.rows; if(!rows.length){alert(T('noData'));return;}
  const dpr=2, W=1180, RH=64, HH=96, PAD=10;
  const cv=document.getElementById('cv'); const H=HH+RH*rows.length+PAD*2;
  cv.width=W*dpr; cv.height=H*dpr; const x=cv.getContext('2d'); x.scale(dpr,dpr);
  x.fillStyle='#fff'; x.fillRect(0,0,W,H);
  const F=(s,w)=>{x.font=(w||'')+' '+s+'px system-ui,"Hiragino Sans","Noto Sans JP","Noto Sans TC","Noto Sans KR",sans-serif';};
  const box=(a,b,c,d,fill,stroke)=>{if(fill){x.fillStyle=fill;x.fillRect(a,b,c,d);} x.strokeStyle=stroke||'#999';x.lineWidth=1;x.strokeRect(a,b,c,d);};
  const ctr=(t,a,b,c,d,col,sz,w)=>{F(sz||13,w);x.fillStyle=col||'#222';x.textAlign='center';x.textBaseline='middle';x.fillText(t,a+c/2,b+d/2,c-8);};
  const C=[PAD,PAD+150,PAD+150+52,PAD+150+52+300,PAD+150+52+300+230];
  const CW=[150,52,300,230,W-2*PAD-(150+52+300+230)];
  // ヘッダ
  box(C[0],PAD,CW[0],HH,'#FFFF66');
  ctr(B.date||'',C[0],PAD,CW[0],HH,'#222',26,'bold');
  box(C[1],PAD,CW[1],HH,'#FFFF66'); ctr('Lv',C[1],PAD,CW[1],HH,'#222',15,'bold');
  const h3=(a,w,t)=>{box(a,PAD,w,HH,'#FFFF66');F(12,'bold');x.fillStyle='#222';x.textAlign='center';x.textBaseline='middle';
    t.forEach((s,i)=>x.fillText(s,a+w/2,PAD+HH/2+(i-1)*17,w-8));};
  h3(C[2],CW[2],['開放的城池','開放される城','개방되는 성']);
  h3(C[3],CW[3],['佔領城池的公會','占拠ギルド','성을 점령하는 길드']);
  h3(C[4],CW[4],['獲得入場獎勵的公會','入場報酬を受け取るギルド','입장 보상을 받는 길드']);
  // 行
  rows.forEach((r,i)=>{
    const y=PAD+HH+RH*i, ci=CITY[r.c]||{lv:1};
    box(C[0],y,CW[0],RH,'#fff'); box(C[1],y,CW[1],RH,'#fff');
    ctr(String(ci.lv),C[1],y,CW[1],RH,'#222',15,'bold');
    box(C[2],y,CW[2],RH,'#fff');
    F(14,'');x.fillStyle='#222';x.textAlign='center';x.textBaseline='middle';
    x.fillText('《'+ci.j+'｜'+ci.t+'｜'+ci.k+'》',C[2]+CW[2]/2,y+RH/2,CW[2]-10);
    box(C[3],y,CW[3],RH,r.occ?gcolor(r.occ)+'55':'#fff');
    ctr(r.occ||'',C[3],y,CW[3],RH,'#222',14,'');
    const sl=slots(r.c), n=Math.max(sl.length,1), cw=CW[4]/n;
    sl.forEach((s,k)=>{
      const a=C[4]+cw*k, g=(r.a||{})[s.lv]||'';
      box(a,y,cw*0.28,RH,'#F3EDE4'); ctr(s.g?String(s.g):'—',a,y,cw*0.28,RH,'#222',13,'bold');
      box(a+cw*0.28,y,cw*0.72,RH,g?gcolor(g)+'55':'#fff');
      ctr(g,a+cw*0.28,y,cw*0.72,RH,'#222',13,'');
    });
  });
  cv.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download='entry-'+(B.date||'plan')+'.png';a.click();});
}

document.querySelectorAll('.langs button').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();render();});
load(); render(); doPull(false);
